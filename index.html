<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 설명: 한글이 깨지지 않도록 설정합니다. -->
  <meta charset="UTF-8">

  <!-- 설명: 모바일 화면 대응을 위한 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">

  <title>갤러리</title>
</head>

<body>
  <!-- 실습 흐름: 갤러리는 같은 구조의 카드가 반복된다는 점을 먼저 설명합니다. -->
  <header class="gallery-header">
    <!-- 실습 1: 페이지 제목을 작성합니다. 예: 갤러리 -->
    <h1 class="page-title">갤러리</h1>

    <!-- 실습 2: 갤러리 소개 문구를 작성합니다. -->
    <p class="page-desc">다양한 이미지를 카드 형태로 확인해보세요</p>
  </header>

  <main>
    <section class="gallery-section">
      <!-- 실습 3: 섹션 제목을 작성합니다. 예: 추천 이미지 -->
      <h2>추천이미지</h2>

      <!-- 여러 개의 카드를 넣을 공간  -->
      <div class="gallery-list">

        <!-- 설명: article은 카드 하나처럼 독립적인 콘텐츠를 표현할 때 사용합니다. -->
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://pds.joongang.co.kr/news/component/htmlphoto_mmdata/202404/04/d1c9eb18-7096-42f4-a3fb-c8a7fbc55f09.jpg
" alt="사진 1" class="card-img">

          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">카리나 </h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">에스파</p>

          <button class="card-btn" type="button">자세히 보기</button>
        </article>
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://cdn.nc.press/news/photo/202608/624112_853654_5423.jpg" alt="사진 2" class="card-img">

          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">한수아</h3>

          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">배우</p>

          <button class="card-btn" type="button">자세히 보기</button>
        </article>
        <article class="card">
          <!-- 실습 4: alt에는 이미지가 무엇인지 설명하는 문구를 작성합니다. -->
          <img src="https://i.ytimg.com/vi/1rAos7HClwI/maxresdefault.jpg" alt="사진 3" class="card-img">
    
          <!-- 실습 5: 카드 제목을 작성합니다. -->
          <h3 class="card-title">신류진</h3>
    
          <!-- 실습 6: 카드 설명 문장을 작성합니다. -->
          <p class="card-desc">ITZY</p>
    
          <button class="card-btn" type="button">자세히 보기</button>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <!-- 실습 8: 페이지 하단 문구를 작성합니다. -->
    <p><!-- 푸터 문구 --></p>
  </footer>

  <script src="./js/script.js"></script>
</body>

</html>
